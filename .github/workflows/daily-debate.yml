# The name shown in the GitHub "Actions" tab.
name: Daily debate

# Generates the day's debate on the hosted backend. Free hosts sleep when idle, so an external
# cron (this) is what wakes the service and triggers the run; see docs/DEPLOY_FREE.md.
# Needs repository secrets BACKEND_URL and ADMIN_TOKEN. GitHub disables scheduled workflows
# after 60 days without repository activity; re-enable it from the Actions tab if that happens.

# When this workflow runs:
on:
  # On a timetable (cron format: minute hour day-of-month month day-of-week).
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC; the backend saves under the UTC date
  # Or by hand from the Actions tab, with one checkbox.
  workflow_dispatch:
    inputs:
      force:
        description: "Generate again even if today's debate already exists"
        type: boolean
        default: false

# The workflow may only read the repository contents.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # Give up if the job runs longer than 40 minutes.
    timeout-minutes: 40
    # Environment variables the script reads. The values of "secrets" come from the repository settings
    # and are hidden in the logs.
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # 'true' only if the manual run had the checkbox ticked; scheduled runs always get 'false'.
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    steps:
      # Download the repository (we need the script in it).
      - uses: actions/checkout@v4
      # If a secret is missing, print a friendly note instead of failing.
      - name: Not configured
        if: env.BACKEND_URL == '' || env.ADMIN_TOKEN == ''
        run: echo "::notice::Set the BACKEND_URL and ADMIN_TOKEN repository secrets to enable the daily run."
      # With both secrets present: wake the backend, start the run, and wait until the debate is saved.
      - name: Generate today's debate
        if: env.BACKEND_URL != '' && env.ADMIN_TOKEN != ''
        run: deploy/scripts/trigger_daily.sh
