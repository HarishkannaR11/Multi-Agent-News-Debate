# The name shown in the GitHub "Actions" tab.
name: CI

# When this workflow runs:
on:
  # On every push to the main branch.
  push:
    branches: [main]
  pull_request:   # feature branches are covered here; a push trigger on them would run everything twice
  workflow_dispatch:   # manual run for a branch that has no open pull request

# If a newer run starts for the same branch, cancel the older one (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow may only read the repository contents.
permissions:
  contents: read

# The jobs; they run in parallel unless one says "needs" another.
jobs:
  # Job 1: check the Python backend.
  backend:
    # Run on a GitHub-provided Ubuntu machine.
    runs-on: ubuntu-latest
    steps:
      # Download the repository code onto the machine.
      - uses: actions/checkout@v4
      # Install Python 3.11, and cache pip downloads keyed on the requirements files.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # No torch here: tests never load the guardrail models (they are built lazily).
      # Install the libraries needed for testing and linting.
      - run: pip install -r backend/requirements-dev.txt
      # Style and bug check with ruff.
      - run: ruff check backend
      # Type check with mypy (its settings are in pyproject.toml).
      - run: mypy
      # Run the unit tests.
      - run: pytest

  # Job 2: check the Next.js frontend.
  frontend:
    runs-on: ubuntu-latest
    # Run every "run" step from inside the frontend folder.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Install Node.js 22 and cache npm downloads keyed on the lock file.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Install exactly the locked package versions.
      - run: npm ci
      # TypeScript check, lint, unit tests.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Make sure the production build works (without sending Next.js telemetry).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Job: check the Terraform deployment (formatting and validity; nothing is created).
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      # Install a pinned Terraform version.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      # Formatting must match "terraform fmt".
      - run: terraform fmt -check -recursive
      # Download the AWS provider (no credentials needed) and check the configuration is valid.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Job 3: build the Docker images and test them.
  docker:
    # Build both images (no push) so a broken Dockerfile fails the PR, not the deploy,
    # then smoke-test the backend image the way it will actually run.
    runs-on: ubuntu-latest
    # Start only after the two jobs above have passed.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Set up Docker Buildx, the modern image builder (supports caching).
      - uses: docker/setup-buildx-action@v3
      # Build the backend image from the repo root and load it into the local Docker (do not push it anywhere).
      # The cache-from/cache-to lines reuse layers from earlier runs, stored in GitHub's cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: counterpoint-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # Build the frontend image the same way.
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: counterpoint-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Run "id -u" in the container; fail if it prints 0 (0 = root).
      - name: Backend runs unprivileged
        run: test "$(docker run --rm counterpoint-backend:ci id -u)" != "0"

      # Scan both images for known vulnerabilities in operating-system packages and libraries.
      # Only CRITICAL problems that already have a fix available fail the build (high noise otherwise).
      # Trivy runs from its official image (pinned version) and reads the images from the local Docker.
      - name: Scan the images for vulnerabilities (Trivy)
        run: |
          for image in counterpoint-backend:ci counterpoint-frontend:ci; do
            echo "::group::trivy $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.71.2 \
              image --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
            echo "::endgroup::"
          done

      - name: Guardrail models load offline as the runtime user
        # --network none proves the models were baked in at build time and that the unprivileged
        # user can read them (the first build passed while these would have failed at runtime).
        run: |
          # Start a container with no network, feed it the Python program below (up to the PY line) on standard input,
          # and save its error output to a file for the check at the end.
          docker run --rm -i --network none counterpoint-backend:ci python - 2>guard-stderr.txt <<'PY'
          # The two safety checks the app uses.
          from backend.graph.guardrails.input_guard import check_input
          from backend.graph.guardrails.output_guard import check_output

          # A harmless sentence must pass.
          clean = check_input("The committee will vote on the budget proposal on Tuesday.")
          assert clean.passed, clean
          # An abusive sentence must be rejected.
          toxic = check_input("You are a worthless idiot and everyone hates you, go die.")
          assert not toxic.passed, toxic
          # Text with personal data must still pass (the guard redacts it rather than blocking it).
          pii = check_output("Contact John Smith at john.smith@example.com or 555-123-4567.")
          assert pii.passed, pii
          print("PII output guard returned:", pii.text)
          print("guardrails OK offline")
          PY
          # A traceback that was merely caught still means something tried to reach the network.
          # Search the saved error output for DNS-failure messages; if found, print them and fail the step.
          if grep -q -E "NameResolutionError|Temporary failure in name resolution" guard-stderr.txt; then
            echo "::error::a guardrail tried to use the network at runtime"
            cat guard-stderr.txt
            exit 1
          fi

      - name: Backend answers /health
        run: |
          # Start the backend container in the background, publishing port 8000.
          docker run -d --name api -p 8000:8000 counterpoint-backend:ci
          # Try for up to 60 seconds (30 tries, 2 seconds apart); "exit 0" ends the step successfully as soon as it answers.
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 2
          done
          # Never answered: show the container's logs and fail.
          docker logs api
          exit 1

      # The free-hosting variant: same image, but uid 1000 and port 7860 as Hugging Face Spaces require.
      - name: Assemble the Hugging Face Space bundle
        run: |
          # Check the daily-trigger script for syntax errors without running it.
          bash -n deploy/scripts/trigger_daily.sh
          # Create the Space folder (Dockerfile with uid 1000 and port 7860) in the runner's temp folder.
          deploy/huggingface/build_bundle.sh "$RUNNER_TEMP/space"
      # Build an image from that generated folder.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/space
          load: true
          tags: counterpoint-space:ci
          cache-from: type=gha,scope=backend
      - name: Space image runs as uid 1000 and answers on 7860
        run: |
          # The user id must be exactly 1000.
          test "$(docker run --rm counterpoint-space:ci id -u)" = "1000"
          docker run -d --name space -p 7860:7860 counterpoint-space:ci
          # Same wait loop as before, on port 7860.
          for i in $(seq 1 30); do
            curl -fsS localhost:7860/health && exit 0
            sleep 2
          done
          docker logs space
          exit 1

      # The AWS deployment shape: Redis + backend + frontend behind the Caddy router, run from the
      # images built above exactly as deploy/aws/docker-compose.yml starts them on the server.
      - name: Start the full stack (compose)
        run: |
          # Remove the two test containers so ports 8000 and 7860 are free.
          docker rm -f api space
          # The smoke test's WebSocket check needs this Python library.
          pip install --quiet websockets
          # Write a test .env, one line per setting: a fake Groq key, an admin token, and small rate limits
          # that the smoke test relies on (2 per client; the site-wide cap off).
          printf '%s\n' \
            'GROQ_API_KEY=ci-not-a-real-key' \
            'ADMIN_TOKEN=ci-admin-token-ci-admin-token' \
            'OPINION_RATE_LIMIT=2' \
            'OPINION_GLOBAL_LIMIT_PER_HOUR=0' > deploy/aws/.env
          cd deploy/aws
          # Start everything using the images built above (--no-build stops compose from rebuilding them).
          BACKEND_IMAGE=counterpoint-backend:ci FRONTEND_IMAGE=counterpoint-frontend:ci \
            docker compose up -d --no-build
      - name: Stack smoke test (routing, WebSocket, rate limiting through the proxy)
        run: |
          # Run the smoke test; if it fails, print the last 80 log lines of every container, then fail the step.
          deploy/aws/smoke_test.sh || { docker compose -f deploy/aws/docker-compose.yml logs --tail 80; exit 1; }
