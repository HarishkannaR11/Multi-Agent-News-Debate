# Dependabot opens pull requests when a dependency has a new version or a security fix.
version: 2
updates:
  # Python libraries. The pinned lock file is backend/requirements.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # One pull request for all minor and patch updates, so there is less noise.
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  # JavaScript libraries for the website.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  # Base images in the two Dockerfiles.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  # The actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
